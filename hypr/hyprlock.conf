# background

background {
    monitor =
    path = $HOME/wallpapers/dominik-mayer-10.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.65
}

# clock

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# date

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = rgba(255, 255, 255, 0.65)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# input

input-field {
    monitor =

    size = 260, 52
    outline_thickness = 1

    inner_color = rgba(255, 255, 255, 0.08)
    outer_color = rgba(255, 255, 255, 0.18)

    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false

    placeholder_text = <i>Password</i>

    position = 0, -40

    halign = center
    valign = center

    rounding = 16
}