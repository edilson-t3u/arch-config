# font

font_family JetBrainsMono Nerd Font
font_size 12.5

# window

background_opacity 0.92
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# cursor

cursor_shape beam
cursor_blink_interval 0.6

# scrollback

scrollback_lines 10000

# tabs

tab_bar_style powerline
tab_bar_edge bottom
tab_bar_min_tabs 2

# shell

shell zsh

# behavior

enable_audio_bell no
visual_bell_duration 0
allow_remote_control no

# url

url_style curly
open_url_with default

# selection

copy_on_select no
strip_trailing_spaces smart

# mouse

mouse_hide_wait 3.0

# performance

repaint_delay 10
input_delay 3
sync_to_monitor yes

# colors

foreground #F5F5F7
background #18181B

selection_foreground #18181B
selection_background #D4D4D8

cursor #F5F5F7
cursor_text_color #18181B

# black
color0 #18181B
color8 #52525B

# red
color1 #FF6B6B
color9 #FF8585

# green
color2 #A3E635
color10 #BEF264

# yellow
color3 #FACC15
color11 #FDE047

# blue
color4 #60A5FA
color12 #93C5FD

# magenta
color5 #C084FC
color13 #D8B4FE

# cyan
color6 #22D3EE
color14 #67E8F9

# white
color7 #E4E4E7
color15 #FFFFFF

# appearance

background_opacity 0.88
dynamic_background_opacity yes

window_padding_width 16

# font

font_size 13

# tabs

tab_bar_style powerline
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# cursor

cursor_shape beam
cursor_blink_interval 0.6