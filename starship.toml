format = '$directory$git_branch$git_status$character'

[directory]
style = 'bold white'
format = '[$path]($style) '

[git_branch]
symbol = ' '
style = 'bold purple'
format = '[$symbol$branch]($style) '

[git_status]
style = 'bold yellow'
format = '[$all_status$ahead_behind]($style) '

[character]
success_symbol = '[❯](bold white)'
error_symbol = '[✗](bold red)'

[username]
disabled = true

[hostname]
disabled = true

[cmd_duration]
disabled = true

[line_break]
disabled = true